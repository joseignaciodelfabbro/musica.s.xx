<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

     <link rel="stylesheet" type="text/css" href="normalize.css">
    <link rel="stylesheet" type="text/css" href="minimalEst.css">
   
    <title>MÚSICA DE SIGLO XX</title>
</head>
<body>

    <div class="general">
        <div class="encabezado">
            <h1>MÚSICA DE SIGLO XX</h1>
        </div>

         <div class="pass">
              <input type="password" id="password" placeholder="Ingresa tu contraseña">
              <button id="login-button">Iniciar Sesión</button>
              <div id="error-message" style="color:red;"></div>
        </div>

        
        <div class="formulario">
  <p><strong>Contáctese por aquí:</strong></p>

  <form name="contact" method="POST" data-netlify="true">

    <input type="hidden" name="form-name" value="contact">

    <label for="nombre">Nombre del alumno</label>
    <input type="text" id="nombre" name="nombre" required>

    <label for="email">Correo electrónico</label>
    <input type="email" id="email" name="email" required>

    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

    <button type="submit" class="botmail">Enviar</button>
  </form>
</div>

      </div>


    
             
    </div>

    <!-- Vinculamos el archivo JavaScript externo -->
    <script src="login.js" defer></script>
    
</body>
